<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SWAGFAG SKELLY CLUB</title>
<meta name="description" content="SWAGFAG SKELLY CLUB">
<link rel="icon" href="assets/ui/skelly.webp">
<link rel="stylesheet" href="css/style.css?v=135730">
</head>
<body>

<!-- the procedural dusk: fixed behind everything -->
<div class="sky-wrap" aria-hidden="true">
  <canvas id="sky"></canvas>
  <div class="sky-vignette"></div>
</div>

<div class="page">

  <nav id="topnav">
    <a href="#world">world</a>
    <a href="#wardrobe">wardrobe</a>
    <a href="#contact">contact</a>
  </nav>

  <!-- ═══════════ I · THE MARK ═══════════ -->
  <section class="s-mark">
    <div class="mark-inner">
      <div class="mark-stack">
        <img id="ghostA" aria-hidden="true" src="assets/mark/wordmark.webp" alt="">
        <img id="ghostB" aria-hidden="true" src="assets/mark/wordmark.webp" alt="">
        <img id="mark" src="assets/mark/wordmark.webp" alt="Swagfag Skelly Club">
      </div>
      <p class="creed">Swag is a spiritual condition</p>
      <div class="members-only">
        <i></i><span>members only</span>
      </div>
    </div>
  </section>

  <!-- ═══════════ II · THE STRETCH ═══════════ -->
  <section id="world" class="s-stretch">
    <img class="stretch-decal" aria-hidden="true" src="assets/decal/cashgrabber.webp" alt="">
    <div class="figure-row" id="figureRow"></div>
    <p class="row-note">Touch it to see it straight</p>
  </section>

  <!-- ═══════════ III · KNOCKOUT ═══════════ -->
  <section id="wardrobe" class="s-knockout">
    <img id="stretchMark" aria-hidden="true" src="assets/mark/wordmark.webp" alt="">
  </section>

  <!-- ═══════════ IV · THE RUN ═══════════ -->
  <section class="s-run">
    <div class="run-lane"><div class="run-track run-l" id="runA"></div></div>
    <div class="run-lane run-lane-2"><div class="run-track run-r" id="runB"></div></div>
  </section>

  <!-- ═══════════ V · THE HOLE ═══════════ -->
  <section class="s-hole">
    <img id="hole" src="assets/trinkets/forbidden-slideshow.gif"
         alt="Animated collage of Skelly Club artwork">
  </section>

  <!-- ═══════════ THE VAULT ═══════════ -->
  <section id="registry" class="s-tool">
    <p class="tool-label">the vault</p>
    <div class="filters">
      <input id="fId" type="search" inputmode="numeric" placeholder="name one · 0–2999" size="16">
      <button id="fSummon" type="button">bring up</button>
      <select id="fCat"><option value="">wearing…</option></select>
      <select id="fVal"><option value="">—</option></select>
      <button id="fRandom" type="button">draw blind</button>
    </div>
    <div id="vault">
      <figure class="cutout-frame">
        <div id="veil" class="cutout-stage"><img id="vaultImg" alt=""></div>
        <figcaption id="vaultCap">closed</figcaption>
      </figure>
      <div class="vault-side">
        <table class="traits" id="vaultTraits"></table>
        <p class="vault-hint" id="vaultHint">name one, or draw blind</p>
      </div>
    </div>
    <details class="ledger-wrap">
      <summary>ledger</summary>
      <div id="ledger" class="ledger"></div>
    </details>
  </section>

  <!-- ═══════════ THE FORGE ═══════════ -->
  <section id="forge" class="s-tool">
    <p class="tool-label">the bone forge</p>
    <div class="forge-wrap">
      <canvas id="forgeCanvas" width="540" height="540"
              aria-label="The skeleton you are assembling"></canvas>
      <div>
        <div class="forge-ctl" id="forgeCtl"></div>
        <div class="forge-btns">
          <button id="fgRandom" type="button">roll bones</button>
          <button id="fgSave" type="button">download</button>
        </div>
        <p class="forge-note" id="forgeScore">not in the ledger</p>
      </div>
    </div>
  </section>

  <!-- ═══════════ VI · COLOPHON ═══════════ -->
  <footer id="contact">
    <img class="colophon-mark" src="assets/mark/wordmark.webp" alt="Swagfag Skelly Club">
    <div class="colophon-nav">
      <a href="#world">world</a>
      <a href="#wardrobe">wardrobe</a>
      <a href="#contact">contact</a>
    </div>
    <div class="colophon-meta">
      <span>members only</span>
      <span>Est. MMXXIV</span>
    </div>
  </footer>

</div>

<script src="js/app.js?v=135730" type="module"></script>
</body>
</html>
